name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is handled by the CD workflow

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Train model
        run: python -m src.train

      - name: Quality gate (fails the build if the model is not good enough)
        run: python -m src.evaluate

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
